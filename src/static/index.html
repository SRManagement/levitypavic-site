    function renderDesk() {
      const d = state.desk;
      document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === state.tab));
      const waitingCount = d.pending.length + (d.deposits || []).length + (d.chatter_drafts || []).length + (d.fanvue_drafts || []).length + (d.coinbase_drafts || []).length;
      document.querySelector('[data-tab="pending"]').textContent = waitingCount ? `New (${waitingCount})` : "New";
      const x = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      const CHEV = '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg>';
      const check = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
      let html = "";
      if (state.tab === "pending") {
        // Month-end Fanvue expense + weekly chatting invoice: amount is editable before it goes to the sheet.
        html = (d.fanvue_drafts || []).map((f) => `<div class="row draft"><div class="grow-min"><b>Fanvue · ${esc(f.label)}</b>
            <div class="sub">Month closed · calculated ${usd(f.amount)} · goes to the Fixed table</div></div>
          <div class="acts"><label class="amt-edit"><span>$</span><input class="input" type="number" inputmode="decimal" min="0" step="0.01" value="${Number(f.amount).toFixed(2)}" data-draft-amount="${esc(f.id)}" aria-label="Fanvue amount" /></label>
            <button class="icon ok" data-act="fanvue-approve" data-id="${esc(f.id)}" aria-label="Log this month's Fanvue expense">${check}</button><button class="icon no" data-act="fanvue-skip" data-id="${esc(f.id)}" aria-label="Skip">${x}</button></div></div>`).join("");
        html += (d.chatter_drafts || []).map((c) => `<div class="row draft"><div class="grow-min"><b>Chatting agency · ${esc(c.label)}</b>
            <div class="sub">${c.missed ? `Never logged in the sheet · ${c.known ? "invoice amount on record" : "calculated"} ${usd(c.amount)} · check it, then ✓` : `Week closed Sun 11:59 PM Serbia · calculated ${usd(c.amount)}`}</div></div>
          <div class="acts"><label class="amt-edit"><span>$</span><input class="input" type="number" inputmode="decimal" min="0" step="0.01" value="${Number(c.amount).toFixed(2)}" data-draft-amount="${esc(c.id)}" aria-label="Invoice amount" /></label>
            <button class="icon ok" data-act="chatter-approve" data-id="${esc(c.id)}" aria-label="Add this invoice to the sheet">${check}</button><button class="icon no" data-act="chatter-skip" data-id="${esc(c.id)}" aria-label="Skip this invoice">${x}</button></div></div>`).join("");
        html += (d.coinbase_drafts || []).map((c) => `<div class="row draft"><div class="grow-min"><b>Fanvue payout to Coinbase · ${esc(c.label)}</b>
            <div class="sub">What you paid out to Coinbase for the agency this week · goes to the Income tab's Fanvue Payouts</div></div>
          <div class="acts"><label class="amt-edit"><span>$</span><input class="input" type="number" inputmode="decimal" min="0" step="0.01" value="${Number(c.amount).toFixed(2)}" data-draft-amount="cb-${esc(c.id)}" aria-label="Payout amount" /></label>
            <button class="icon ok" data-act="coinbase-approve" data-id="${esc(c.id)}" aria-label="Log this payout">${check}</button><button class="icon no" data-act="coinbase-skip" data-id="${esc(c.id)}" aria-label="Skip">${x}</button></div></div>`).join("");
        // Card charges + payouts landing in Chase: nothing is logged until you ✓ (✕ = Trash).
        const chargeCard = (e, kind) => `<div class="row charge${kind === "deposit" ? " payout" : ""}">
          <div class="ch-main">
            <div class="ch-title"><b>${esc(e.item)}</b>${e.pending ? PEND : ""}</div>
            <div class="ch-date">${monDay(e.date)} <span>(${dayName(e.date)})</span></div>
            <div class="ch-time">${timeLabel(e)}</div>
            ${e.why ? `<div class="ch-why">${esc(e.why)}</div>` : ""}
          </div>
          <div class="ch-side">
            <b class="ch-amt">${kind === "deposit" ? "+" : ""}${usd(e.amount)}</b>
            <div class="acts"><button class="icon ok" data-act="${kind}-approve" data-id="${esc(e.id)}" aria-label="${kind === "deposit" ? "Log this payout on the Income tab" : "Business expense: add to sheet"}">${check}</button><button class="icon no" data-act="${kind}-skip" data-id="${esc(e.id)}" aria-label="${kind === "deposit" ? "Not a Fanvue payout" : "Not a business expense: trash"}">${x}</button></div>
          </div></div>`;
        html += (d.deposits || []).map((e) => chargeCard({ ...e, item: "Fanvue payout landed in Chase", why: "Goes to the Income tab (Fanvue Payouts) when you ✓" }, "deposit")).join("");
        html += d.pending.map((e) => chargeCard(e, "bank")).join("");
        html = html || `<p class="empty">${d.bank.connected ? "No new charges." : "Connect your bank in Moderator to see new card charges here."}</p>`;
      } else if (state.tab === "trash") {
        html = d.trash.map((e) => `<div class="row"><div><b>${esc(e.item || e.provider)}</b><div class="sub">${e.date} · ${usd(e.amount)}${e.kind === "bank" ? " · card" : e.kind === "deposit" ? " · payout" : ""}</div></div>
          <div class="acts"><button class="btn" data-act="${e.kind === "bank" ? "bank-approve" : e.kind === "deposit" ? "deposit-approve" : "verified"}" data-id="${esc(e.id)}">Recover</button></div></div>`).join("");
        html = html || '<p class="empty">Trash is empty.</p>';
      } else {
        const thisYear = String(new Date().getFullYear());
        const short = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", iso.startsWith(thisYear) ? { month: "short", day: "numeric" } : { month: "short", year: "2-digit" });
        const providerGroup = (g, max) => {
          const items = g.items.map((e) => itemRow(e)).join("");
          return `<div class="vgroup ${state.open.has(g.provider) ? "open" : ""}">
            <button class="vhead" type="button" data-prov="${esc(g.provider)}">
              <div><b>${esc(g.provider)}</b><div class="sub">${g.count} charge${g.count === 1 ? "" : "s"} · last ${short(g.last)}</div></div>
              <span class="tot">${usd(g.total)}</span>${CHEV}
              <i class="vbar"><i style="width:${Math.max(2, (g.total / max) * 100).toFixed(1)}%"></i></i>
            </button>
            <div class="vitems">${items}<button class="linkbtn" data-act="trash-provider" data-provider="${esc(g.provider)}">Trash every ${esc(g.provider)} charge (all months)</button></div>
          </div>`;
        };
        const itemRow = (e) => `<div class="vitem"><span class="d">${short(e.date)}</span>
            <span class="n" title="${esc(e.item)}${e.pending ? " (pending: not posted by the bank yet)" : ""}">${esc(e.item)}${e.pending ? PEND : ""}${e.qty > 1 ? `<small>${e.qty} × ${usd(e.amount / e.qty)}</small>` : ""}</span>
            <b>${usd(e.amount)}</b><button class="icon no" data-act="trash" data-id="${esc(e.id)}" aria-label="Trash this charge">${x}</button></div>`;
        // One collapsed rectangle per category; the title + total stays above it.
        const category = (key, title, total, summary, body) => `<div class="vsec"><span>${title}</span><b>${usd(total)}</b></div>
          <div class="vgroup vcat ${state.open.has(key) ? "open" : ""}">
            <button class="vhead" type="button" data-prov="${key}"><div><b>${summary}</b></div><span></span>${CHEV}</button>
            <div class="vitems">${body}</div>
          </div>`;
        // One period picker for all three categories (default: this month). Everything starts at the
        // business start (April 2026, when Fanvue earnings began).
        const startIso = d.business_start || "2026-04-01";
        // Picker: pick a year (‹ 2026 ›), then a month. Years run from the start year to the current
        // year, so a new year shows up on its own when the calendar rolls over (d.month is the
        // server's PT month). Months before April 2026 or after this month are greyed out.
        const curYear = Number(d.month.slice(0, 4));
        const startYear = Number(startIso.slice(0, 4)), startMonth = startIso.slice(0, 7);
        const pad = (n) => String(n).padStart(2, "0");
        if (!state.opexMonth || (state.opexMonth !== "all" && (state.opexMonth > d.month || state.opexMonth < startMonth))) state.opexMonth = d.month;
        if (!state.opexYear || state.opexYear > curYear || state.opexYear < startYear) state.opexYear = state.opexMonth === "all" ? curYear : Number(state.opexMonth.slice(0, 4));
        const period = state.opexMonth;
        const inPeriod = (iso) => iso >= startIso && (period === "all" || iso.startsWith(period));
        const monthName = (m) => m === "all" ? "All time" : new Date(m + "-01T12:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" });
        const periodGross = period === "all" ? Object.values(d.gross_months || {}).reduce((a, b) => a + b, 0) : (d.gross_months || {})[period] || 0;
        const ofGross = (v) => periodGross > 0 ? `${((v / periodGross) * 100).toFixed(1)}% of gross` : "no gross yet";
        const emptyNote = period === "all" ? "Nothing yet." : `Nothing in ${monthName(period)}.`;

        // OPEX: grouped by merchant
        const grouped = {};
        d.verified.filter((g) => !g.chatter).flatMap((g) => g.items.map((e) => ({ ...e, provider: g.provider }))).filter((e) => inPeriod(e.date)).forEach((e) => {
          const g = grouped[e.provider] || (grouped[e.provider] = { provider: e.provider, total: 0, count: 0, last: e.date, items: [] });
          g.total += e.amount; g.count += e.qty || 1; g.last = e.date > g.last ? e.date : g.last; g.items.push(e);
        });
        const biz = Object.values(grouped).sort((a, b) => b.total - a.total || a.provider.localeCompare(b.provider));
        const bizTotal = biz.reduce((sum, g) => sum + g.total, 0);
        // Fanvue: one figure per month. Logged in the sheet → that amount; waiting in New → the
        // draft; otherwise the live calculation (the current month keeps climbing until it closes).
        const fvMonths = ((d.fanvue || {}).months || []).filter((m) => m.month >= startMonth && (period === "all" || m.month === period))
          .map((m) => ({ ...m, value: m.logged != null ? m.logged : m.draft != null ? m.draft : m.amount,
                         state: m.logged != null ? "logged" : m.draft != null ? "await" : m.live ? "live" : "calc" }));
        const fvTotal = fvMonths.reduce((sum, m) => sum + m.value, 0);
        // Chatting: this week's live invoice + closed weeks waiting for you + everything logged.
        // A week belongs to the month of its Sunday (the date it's logged under).
        const chat = d.verified.filter((g) => g.chatter).flatMap((g) => g.items).filter((e) => inPeriod(e.date)).sort((a, b) => b.date.localeCompare(a.date));
        const live = d.chatter_live && inPeriod(d.chatter_live.week_end) ? d.chatter_live : null;
        const waitingWeeks = (d.chatter_drafts || []).filter((c) => inPeriod(c.week_end));
        const chatTotal = chat.reduce((sum, e) => sum + e.amount, 0) + waitingWeeks.reduce((sum, c) => sum + c.amount, 0) + (live ? live.amount : 0);
        const TAGS = { live: '<small class="tag live">live</small>', await: '<small class="tag await">needs confirming</small>', logged: '<small class="tag logged">logged</small>', calc: '<small class="tag logged">not logged</small>' };
        const closesAt = (iso) => new Date(iso).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/Los_Angeles" });
        const chatRows = (live ? `<div class="vitem"><span class="d">${short(live.week_end)}</span><span class="n" title="Closes ${closesAt(live.closes)} PT">This week · ${esc(live.label)}${TAGS.live}<small>closes ${closesAt(live.closes)} PT</small></span><b>${usd(live.amount)}</b><span></span></div>` : "")
          + waitingWeeks.map((c) => `<div class="vitem"><span class="d">${short(c.week_end)}</span><span class="n">Chatting agency · ${esc(c.label)}${TAGS.await}</span><b>${usd(c.amount)}</b><span></span></div>`).join("")
          + chat.map(itemRow).join("");
        const chatCount = chat.length + waitingWeeks.length + (live ? 1 : 0);
        // The header compares OPEX only (Fanvue and Chatting are fixed costs, so they'd blur month-to-month).
        const opexPct = periodGross > 0 ? `${((bizTotal / periodGross) * 100).toFixed(1)}%` : "—";

        const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const yr = state.opexYear;
        const panel = state.opexPickerOpen ? `<div class="mp">
            <div class="mp-head">
              <button type="button" class="cal-nav" data-mp-year="-1" aria-label="Previous year"${yr <= startYear ? " disabled" : ""}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 6l-6 6 6 6"/></svg></button>
              <b>${yr}</b>
              <button type="button" class="cal-nav" data-mp-year="1" aria-label="Next year"${yr >= curYear ? " disabled" : ""}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg></button>
            </div>
            <div class="mp-grid">${MONTHS.map((label, i) => {
              const m = `${yr}-${pad(i + 1)}`, off = m > d.month || m < startMonth;
              return `<button type="button" class="mp-m${m === period ? " on" : ""}" data-mp-month="${m}"${off ? " disabled" : ""}>${label}</button>`;
            }).join("")}</div>
            <button type="button" class="mp-all${period === "all" ? " on" : ""}" data-mp-month="all">All time · since ${monthName(startMonth)}</button>
          </div>` : "";
        html += `<div class="opex-month"><button type="button" class="btn opex-pick${state.opexPickerOpen ? " open" : ""}" data-mp-toggle aria-expanded="${!!state.opexPickerOpen}">${monthName(period)}${CHEV}</button>
          <span class="opex-pct"><b>OPEX ${opexPct} of gross</b><small>${usd(bizTotal)} of ${usd(periodGross)}</small></span></div>${panel}`;

        html += category("cat:biz", "OPEX", bizTotal,
          `${ofGross(bizTotal)} · ${biz.length} merchant${biz.length === 1 ? "" : "s"}`,
          biz.map((g) => providerGroup(g, biz[0].total || 1)).join("") || `<p class="empty">${emptyNote}</p>`);
        const fvState = { live: "Live · so far this month", await: "Month closed · needs confirming", logged: "Logged to sheet", calc: "Calculated · not logged" };
        html += category("cat:fanvue", "Fanvue", fvTotal,
          period === "all" ? `${fvMonths.length} month${fvMonths.length === 1 ? "" : "s"} · ${ofGross(fvTotal)}`
            : `${fvMonths[0] ? fvState[fvMonths[0].state] : "Nothing yet"} · ${ofGross(fvTotal)}`,
          fvMonths.map((m) => `<div class="vitem month"><span class="n">${esc(m.label)}${TAGS[m.state]}</span><b>${usd(m.value)}</b></div>`).join("") || `<p class="empty">${emptyNote}</p>`);
        html += category("cat:chat", "Chatting", chatTotal,
          live ? `Live · this week ${usd(live.amount)}${waitingWeeks.length ? ` · ${waitingWeeks.length} to confirm` : ""}`
            : chatCount ? `${chatCount} week${chatCount === 1 ? "" : "s"} & payments${waitingWeeks.length ? ` · ${waitingWeeks.length} to confirm` : ""}` : "No payments",
          chatRows || `<p class="empty">${emptyNote}</p>`);
        html = html || '<p class="empty">Nothing here.</p>';
      }
      $("deskBody").innerHTML = html;
    }
    async function deskAction(btn) {
      const act = btn.dataset.act;
      btn.disabled = true;
      try {
        if (act === "verified" || act === "trash") await api(`/api/expenses/${btn.dataset.id}/status`, { status: act });
        if (act === "bank-approve" || act === "bank-skip") await api(`/api/bank/${encodeURIComponent(btn.dataset.id)}/${act.slice(5)}`, {});
        if (act === "deposit-approve" || act === "deposit-skip") await api(`/api/deposit/${encodeURIComponent(btn.dataset.id)}/${act.slice(8)}`, {});
        if (act === "trash-provider") await api("/api/providers/trash", { provider: btn.dataset.provider });
        if (act === "chatter-skip") await api(`/api/chatter/${encodeURIComponent(btn.dataset.id)}/skip`, {});
        if (act === "fanvue-skip") await api(`/api/fanvue-month/${encodeURIComponent(btn.dataset.id)}/skip`, {});
        if (act === "coinbase-skip") await api(`/api/coinbase-payout/${encodeURIComponent(btn.dataset.id)}/skip`, {});
        if (act === "coinbase-approve") {
          const input = document.querySelector(`[data-draft-amount="cb-${CSS.escape(btn.dataset.id)}"]`);
          const amount = Number(input && input.value);
          if (!Number.isFinite(amount) || amount < 0) throw new Error("Enter the amount first.");
          await api(`/api/coinbase-payout/${encodeURIComponent(btn.dataset.id)}/approve`, { amount });
        }
        if (act === "chatter-approve" || act === "fanvue-approve") {
          const input = document.querySelector(`[data-draft-amount="${CSS.escape(btn.dataset.id)}"]`);
          const amount = Number(input && input.value);
          if (!Number.isFinite(amount) || amount < 0) throw new Error("Enter the amount first.");
          await api(`/api/${act === "chatter-approve" ? "chatter" : "fanvue-month"}/${encodeURIComponent(btn.dataset.id)}/approve`, { amount });
        }
        state.desk = await api("/api/expenses");
        renderDesk();
        loadDashboard(false);
      } catch (err) { btn.disabled = false; alertBanner(err); }
    }
    function alertBanner(err) { if (err instanceof AuthError) location.reload(); else showBanner([err.message]); }

    // ---------- Events ----------
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginErr").textContent = "";
      try { await api("/api/login", { password: $("pw").value }); $("pw").value = ""; boot(); }
      catch (err) { $("loginErr").textContent = err instanceof AuthError ? "Wrong password." : err.message; }
    });
    document.addEventListener("click", async (e) => {
      const t = e.target;
      // OPEX month picker (year ‹ › then month)
      if (t.closest("[data-mp-toggle]")) { state.opexPickerOpen = !state.opexPickerOpen; renderDesk(); return; }
      const mpYear = t.closest("[data-mp-year]");
      if (mpYear) { state.opexYear += Number(mpYear.dataset.mpYear); renderDesk(); return; }
      const mpMonth = t.closest("[data-mp-month]");
      if (mpMonth) {
        state.opexMonth = mpMonth.dataset.mpMonth; state.opexPickerOpen = false;
        if (state.opexMonth !== "all") state.opexYear = Number(state.opexMonth.slice(0, 4));
        renderDesk(); return;
      }
      if (state.opexPickerOpen && !t.closest(".mp")) { state.opexPickerOpen = false; renderDesk(); }
      const menu = $("rangeMenu");
      if (t.closest("#rangeBtn")) { closeCal(); menu.classList.toggle("hidden"); return; }
      if (t.closest("#customBtn")) { $("calPop").classList.contains("hidden") ? openCal() : closeCal(); return; }
      const dayBtn = t.closest("[data-day]");
      if (dayBtn) { pickDay(dayBtn.dataset.day); return; }
      const nav = t.closest("[data-cal-nav]");
      if (nav) { cal.view = new Date(cal.view.getFullYear(), cal.view.getMonth() + Number(nav.dataset.calNav), 1); renderCal(); return; }
      const calAct = t.closest("[data-cal]");
      if (calAct) {
        if (calAct.dataset.cal === "apply" && cal.a) {
          state.range = "custom"; state.custom = { start: cal.a, end: cal.b || cal.a };
          loadDashboard(false).catch(alertBanner);
        }
        closeCal(); return;
      }
      if (!t.closest("#calPop")) closeCal();
      if (!t.closest(".range")) menu.classList.add("hidden");
      const r = t.closest("[data-range]");
      if (r) { state.range = r.dataset.range; menu.classList.add("hidden"); loadDashboard(false).catch(alertBanner); return; }
      const bellMenu = $("notifMenu");
      if (t.closest("#bellBtn")) { const open = bellMenu.classList.toggle("hidden") === false; $("bellBtn").setAttribute("aria-expanded", String(open)); return; }
      const vfy = t.closest("[data-notif-verify]");
      if (vfy) { verifyNotif(vfy.dataset.notifVerify); return; }
      const clr = t.closest("[data-notif-clear]");
      if (clr) { clearNotif(clr.dataset.notifClear); return; }
      if (t.closest("[data-notif-open]")) { bellMenu.classList.add("hidden"); openExpenses(); return; }
      if (!t.closest(".bell-wrap")) { bellMenu.classList.add("hidden"); $("bellBtn").setAttribute("aria-expanded", "false"); }
      if (t.closest("#openMod") || t.closest("[data-open-mod]")) { $("modBg").classList.remove("hidden"); return; }
      if (t.closest("#openExpenses") || t.closest("#tileOpex")) { $("modBg").classList.add("hidden"); openExpenses(); return; }
      if (t.closest("[data-close]") || t.classList.contains("overlay") && t.id !== "gate") { t.closest(".overlay").classList.add("hidden"); return; }
      const prov = t.closest("[data-prov]");
      if (prov) {
        const name = prov.dataset.prov; state.open.has(name) ? state.open.delete(name) : state.open.add(name);
        if (prov.isConnected) prov.parentElement.classList.toggle("open"); else renderDesk();   // the desk was just re-rendered (picker closed)
        return;
      }
      const tab = t.closest("[data-tab]");
      if (tab) { state.tab = tab.dataset.tab; renderDesk(); return; }
      const act = t.closest("[data-act]");
      if (act) { deskAction(act); return; }
      if (t.closest("#bankConnect")) { connectBank(); return; }
      if (t.closest("#taxSwitch")) { $("taxSwitch").classList.toggle("on"); saveSettings(); return; }
      if (t.closest("#taxCalc")) {
        const b = $("taxCalc"); b.disabled = true; b.textContent = "…";
        try {
          const out = await api("/api/tax/estimate", {});
          $("taxHint").textContent = `${(out.rate * 100).toFixed(2)}% of ${usd(out.profit_ytd)} profit this year ≈ ${usd(out.total)} (self-employment ${usd(out.self_employment)}, federal ${usd(out.federal)}, CA ${usd(out.california)}).`;
          await loadDashboard(false);
        } catch (err) { alertBanner(err); }
        b.disabled = false; b.textContent = "Calculate";
      }
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".overlay:not(#gate)").forEach((o) => o.classList.add("hidden")); });
    $("fanvueRate").addEventListener("input", saveSettings);
    $("chatterRate").addEventListener("input", saveSettings);
    $("modelSelect").addEventListener("change", (e) => { state.model = e.target.value; });

    boot();

    // ---------- Live card charges ----------
    // While the page is open: re-check the bank every 3 minutes, and as soon as you come back to the tab.
    // (Plaid also pings the server when it has new charges, so they're usually there before you look.)
    let lastBankCheck = Date.now();
    async function liveBankCheck() {
      if (document.hidden || !state.data || Date.now() - lastBankCheck < 60_000) return;
      lastBankCheck = Date.now();
      try {
        const r = await api("/api/bank/sync", {});
        if (!r || !r.changed) return;
        await loadDashboard(false);
        if (!$("expBg").classList.contains("hidden")) { state.desk = await api("/api/expenses"); renderDesk(); }
      } catch {}
    }
    setInterval(liveBankCheck, 180_000);
    document.addEventListener("visibilitychange", liveBankCheck);
  </script>
</body>
</html>
